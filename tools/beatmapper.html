<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beatmapper</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 15px/1.5 system-ui, sans-serif;
    background: #1c0f22; color: #f5e9f2;
    display: grid; place-items: center; min-height: 100vh; padding: 24px;
  }
  main { width: min(640px, 94vw); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p  { color: #c9b3c6; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button, input[type=file]::file-selector-button {
    font: 600 14px system-ui; color: #fff; background: #d64583;
    border: 0; border-radius: 9px; padding: 9px 16px; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.alt { background: #6e5878; }
  #pad {
    height: 210px; border-radius: 16px; border: 2px dashed #7a5a78;
    display: grid; place-items: center; font-size: 17px; color: #d9c2d6;
    user-select: none; cursor: pointer; margin-bottom: 14px;
  }
  #pad.hit { background: rgba(214, 69, 131, .25); }
  #stats { font-variant-numeric: tabular-nums; color: #e8d5e5; margin-bottom: 14px; }
  textarea {
    width: 100%; height: 150px; border-radius: 10px; border: 1px solid #7a5a78;
    background: #130a18; color: #ffd7ea; font: 12px/1.5 ui-monospace, monospace;
    padding: 10px;
  }
  .hint { font-size: 13px; color: #a98ca6; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>beatmapper</h1>
  <p>1. load your song &nbsp;2. hit play &nbsp;3. tap along (Space or click) &nbsp;4. export</p>

  <div class="row">
    <input type="file" id="file" accept="audio/*">
    <button id="play" disabled>play</button>
    <button id="stop" class="alt" disabled>stop</button>
    <button id="undo" class="alt" disabled>undo tap</button>
    <button id="clear" class="alt" disabled>clear</button>
  </div>

  <div id="pad">tap here on every beat you want a heart</div>
  <div id="stats">no song loaded</div>

  <div class="row">
    <button id="export" disabled>export → copy to clipboard</button>
  </div>
  <textarea id="out" readonly placeholder="your beatmap appears here"></textarea>
  <p class="hint">
    Paste the export into <b>js/beatmap.js</b> inside <code>CUSTOM = [ … ]</code>,
    set <code>songUrl</code> in <b>js/config.js</b>, and you're done.
    Taps are auto-corrected by −80ms for reaction delay.
  </p>
</main>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();

  let buffer = null, source = null;
  let startedAt = 0, playing = false;
  let taps = [];
  const REACTION = 0.080;      // humans tap ~80ms late on average

  function pos() { return playing ? ctx.currentTime - startedAt : 0; }

  function refresh() {
    $('#play').disabled = !buffer || playing;
    $('#stop').disabled = !playing;
    $('#undo').disabled = !taps.length;
    $('#clear').disabled = !taps.length;
    $('#export').disabled = !taps.length;
    $('#stats').textContent = buffer
      ? (playing ? 't = ' + pos().toFixed(1) + 's · ' : '') + taps.length + ' taps'
      : 'no song loaded';
  }
  setInterval(refresh, 120);

  $('#file').addEventListener('change', async function () {
    const f = this.files[0];
    if (!f) return;
    await ctx.resume();
    buffer = await ctx.decodeAudioData(await f.arrayBuffer());
    taps = [];
    $('#out').value = '';
    refresh();
  });

  $('#play').addEventListener('click', async function () {
    await ctx.resume();
    source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    const when = ctx.currentTime + 0.1;
    source.start(when);
    startedAt = when;
    playing = true;
    source.onended = function () { playing = false; refresh(); };
    refresh();
  });

  $('#stop').addEventListener('click', function () {
    if (source) try { source.stop(); } catch (e) {}
    playing = false;
    refresh();
  });

  function tap() {
    if (!playing) return;
    const t = +(pos() - REACTION).toFixed(4);
    if (t > 0) taps.push(t);
    const pad = $('#pad');
    pad.classList.remove('hit');
    void pad.offsetWidth;
    pad.classList.add('hit');
    refresh();
  }

  $('#pad').addEventListener('pointerdown', tap);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) tap(); }
  });

  $('#undo').addEventListener('click', function () { taps.pop(); refresh(); });
  $('#clear').addEventListener('click', function () { taps = []; $('#out').value = ''; refresh(); });

  $('#export').addEventListener('click', function () {
    // sort + drop double-taps closer than 110ms
    const sorted = taps.slice().sort((a, b) => a - b);
    const clean = [];
    for (const t of sorted) {
      if (!clean.length || t - clean[clean.length - 1] >= 0.11) clean.push(t);
    }
    const lines = [];
    for (let i = 0; i < clean.length; i += 8) {
      lines.push('    ' + clean.slice(i, i + 8).join(', '));
    }
    const text = lines.join(',\n');
    $('#out').value = text;
    navigator.clipboard && navigator.clipboard.writeText(text).catch(function () {});
  });
})();
</script>
</body>
</html>
